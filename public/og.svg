<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>FORMIVA — Idea. Form. System.</title>

  <!--
    The social card, drawn from the same lattice as the site's 3D object:
    a grid that is disconnected on the left (idea) and fully drawn on the
    right (form) — the same argument the homepage makes on scroll, made
    once, flat, for a link preview.
  -->

  <rect width="1200" height="630" fill="#F1EEE6"/>

  <!-- Baseline ruler, left edge -->
  <g stroke="#131211" stroke-opacity="0.18" stroke-width="1">
    <line x1="80" y1="80" x2="80" y2="550"/>
    <line x1="72" y1="80" x2="88" y2="80"/>
    <line x1="72" y1="550" x2="88" y2="550"/>
  </g>

  <!-- The lattice: disconnected fragments (left) resolving into a drawn grid (right) -->
  <g stroke="#131211" stroke-width="2" fill="none">
    <!-- fragments -->
    <line x1="640" y1="120" x2="672" y2="120" stroke-opacity="0.35"/>
    <line x1="700" y1="150" x2="722" y2="150" stroke-opacity="0.5"/>
    <line x1="660" y1="200" x2="678" y2="200" stroke-opacity="0.3"/>
    <line x1="612" y1="260" x2="640" y2="260" stroke-opacity="0.45"/>

    <!-- resolving grid, columns 780..1120 step 68, rows 120..540 step 60 -->
    <g stroke-opacity="0.85">
      <line x1="780" y1="120" x2="1120" y2="120"/>
      <line x1="780" y1="180" x2="1120" y2="180"/>
      <line x1="780" y1="240" x2="1120" y2="240"/>
      <line x1="780" y1="300" x2="1120" y2="300"/>
      <line x1="780" y1="360" x2="1120" y2="360"/>
      <line x1="780" y1="420" x2="1120" y2="420"/>
      <line x1="780" y1="480" x2="1120" y2="480"/>
      <line x1="780" y1="540" x2="1120" y2="540"/>
      <line x1="780" y1="120" x2="780" y2="540"/>
      <line x1="848" y1="120" x2="848" y2="540"/>
      <line x1="916" y1="120" x2="916" y2="540"/>
      <line x1="984" y1="120" x2="984" y2="540"/>
      <line x1="1052" y1="120" x2="1052" y2="540"/>
      <line x1="1120" y1="120" x2="1120" y2="540"/>
    </g>
    <!-- one solid cell, the business-systems accent -->
    <rect x="916" y="240" width="68" height="60" fill="#2B4B6B" stroke="none"/>
    <!-- one solid cell, the experience accent -->
    <rect x="1052" y="360" width="68" height="60" fill="#C6421E" stroke="none"/>
  </g>

  <!-- The mark -->
  <g transform="translate(80 130)">
    <rect x="0" y="0" width="16" height="84" fill="#131211"/>
    <rect x="16" y="0" width="56" height="16" fill="#131211"/>
    <rect x="24" y="34" width="36" height="16" fill="#C6421E"/>
  </g>

  <text x="80" y="270" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="700" letter-spacing="1.4" fill="#131211">FORMIVA</text>

  <text x="78" y="360" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="88" font-weight="700" letter-spacing="-3" fill="#131211">IDEA. FORM.</text>
  <text x="78" y="450" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="88" font-weight="700" letter-spacing="-3" fill="#131211">SYSTEM<tspan fill="#C6421E">.</tspan></text>

  <line x1="80" y1="500" x2="500" y2="500" stroke="#131211" stroke-opacity="0.25"/>

  <text x="80" y="530" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace"
        font-size="15" letter-spacing="3" fill="#6b665f">DIGITAL PRODUCTS &amp; BUSINESS SYSTEMS</text>
</svg>
